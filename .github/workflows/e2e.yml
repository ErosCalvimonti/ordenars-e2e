name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The runner image ships its own Appium drivers; keep ours separate.
      APPIUM_HOME: ${{ github.workspace }}/.appium
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out OrdenARS
        uses: actions/checkout@v7.0.1
        with:
          repository: ErosCalvimonti/OrdenARS
          path: OrdenARS

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build the debug APK
        working-directory: OrdenARS
        run: ./gradlew assembleDebug

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run appium:driver

      - name: Type check
        run: npm run typecheck

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on an Android 34 emulator
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        env:
          APK_PATH: OrdenARS/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Give the freshly booted system a moment to settle before testing.
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 45
            npm test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-reports
          path: reports/
          if-no-files-found: ignore
